<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06060a">
  <title>Cyberpunk: Edgerunners</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" aria-label="Página inicial">
    <img src="assets/logo.png" alt="Cyberpunk Edgerunners" class="logo">
  </a>
</header>

<main>

  <input
    id="search"
    type="text"
    placeholder="Filtre por nome ou cargo...  ( / )"
    aria-label="Filtrar personagens por nome ou cargo"
    autocomplete="off"
  >

  <p id="counter" class="counter" aria-live="polite"></p>

  <div id="character-list" class="grid"></div>

</main>

<script src="script.js"></script>

</body>
</html>
